          streamRef.current = null;
        }
        setCamaraActiva(false);
      };

        if (!videoRef.current) return;
        const canvas = document.createElement("canvas");
        canvas.width = videoRef.current.videoWidth || 640;
        canvas.height = videoRef.current.videoHeight || 480;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        setImagenSeleccionada(dataUrl);
        detenerCamara();
      };

        if (!imagenSeleccionada) return;
        setAnalizando(true);
        setResultadoAnalisis(null);

        // Si el usuario configuró una API Key real de Google Gemini
        if (apiKey && !modoDemoForzado) {
          try {
            const base64Data = imagenSeleccionada.split(',')[1];
            const mimeType = imagenSeleccionada.split(';')[0].split(':')[1] || 'image/jpeg';
            
            const prompt = `Analiza esta fotografía de un residuo o material reciclable para Bolivia. Responde estrictamente en formato JSON con la siguiente estructura:
            {
              "material": "Plástico | Papel y Cartón | Vidrio | Metal | Orgánico | Electrónico | Otro",
              "especifico": "Nombre comercial y técnico del residuo",
              "codigoResina": "Código SPI si aplica (ej. 1 PET, 2 HDPE) o No visible/No aplica",
              "estadoVisible": "Limpio, sucio, roto, contaminado, etc.",
              "confianza": "Porcentaje estimado (ej. 90%) y nivel",
              "preparacion": "Instrucciones prácticas para limpiarlo o compactarlo",
              "reutilizacion": "Ideas de upcycling o reuso",
              "precauciones": "Riesgos de corte, toxicidad o higiene",
              "disposicion": "Dónde y cómo entregarlo en centros de acopio",
              "impactoAmbiental": "Cómo previene contaminación de suelos o fuentes hídricas"
            }
            No asumas toxicidad absoluta sin certezas. Si hay duda, dilo.`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: prompt },
                    { inline_data: { mime_type: mimeType, data: base64Data } }
                  ]
                }]
              })
            });

            const data = await res.json();
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
              const rawText = data.candidates[0].content.parts[0].text;
              const jsonMatch = rawText.match(/\{[\s\S]*\}/);
              if (jsonMatch) {
                const parsed = JSON.parse(jsonMatch[0]);
                setResultadoAnalisis({ ...parsed, esModoDemo: false });
                setAnalizando(false);
                return;
              }
            }
          } catch (err) {
            console.warn("Fallo en API Gemini, alternando a modo de demostración contextual:", err);
          }

                    <p className="text-sm">No tienes solicitudes registradas aún.</p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {solicitudes.map(sol => (
                      <div key={sol.id} className="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm flex flex-col sm:flex-row items-center gap-4">
                        <img src={sol.fotoUrl} alt={sol.material} className="w-full sm:w-24 h-24 object-cover rounded-xl border border-slate-100 flex-shrink-0" />
                        
                        <div className="flex-1 space-y-1 w-full text-center sm:text-left">
                          <div className="flex items-center justify-center sm:justify-between flex-wrap gap-2">
                            <span className="font-extrabold text-slate-900 text-sm">{sol.material}</span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                              sol.estado === 'Atendida' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' :
                              sol.estado === 'Recibida' ? 'bg-blue-50 text-blue-800 border-blue-200' :
                              'bg-amber-50 text-amber-800 border-amber-200'
                            }`}>
                              {sol.estado}
                            </span>
                          </div>
                          <p className="text-xs text-slate-500">Destino: <strong className="text-slate-700">{sol.agencia}</strong></p>
                          <p className="text-xs text-slate-500">Cantidad: <strong className="text-eco-700">{sol.cantidadKg} Kg</strong> | Creado: {sol.fecha}</p>
                          <p className="text-[11px] text-slate-600 italic truncate">"{sol.observaciones}"</p>
                        </div>

                        <div className="flex sm:flex-col gap-2 w-full sm:w-auto">
                          <button
                            onClick={() => {
                              setComprobanteGenerado(sol);
                              setVista('comprobante');
                            }}
                            className="flex-1 sm:flex-initial bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg"
                          >
                            Ver Voucher
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 7. VISTA GUÍA ECOLÓGICA Y EDUCATIVA */}
            {vista === 'guia' && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 py-8 space-y-10">
                <div className="text-center max-w-2xl mx-auto space-y-2">
                  <h1 className="text-3xl font-extrabold text-slate-900">Guía Integral de Reciclaje</h1>
                  <p className="text-sm text-slate-600">
                    Aprende los criterios técnicos de clasificación, los códigos de resina y las acciones individuales para proteger el agua, suelo y aire de Bolivia.
                  </p>
                </div>

                {/* 6 Categorías Clave */}
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
                  
                  {/* Plásticos */}
                  <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">🥤</span>
                      <div>
                        <h3 className="font-bold text-slate-900 text-base">Plásticos (1 al 7)</h3>
                        <span className="text-[10px] text-slate-500 uppercase font-semibold">Termoplásticos y Film</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Reconocimiento:</strong> Busca el triángulo con números 1 (PET), 2 (HDPE) o 4 (LDPE).
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Separación:</strong> Enjuagar para retirar restos orgánicos. Quitar la tapa y aplastar.
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Riesgo ambiental:</strong> En ríos bolivianos se fragmenta en microplásticos que consumen peces y fauna endémica.
                    </p>
                  </div>

                  {/* Papel y Cartón */}
                  <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">📦</span>
                      <div>
                        <h3 className="font-bold text-slate-900 text-base">Papel y Cartón</h3>
                        <span className="text-[10px] text-slate-500 uppercase font-semibold">Celulosa reciclable</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Reconocimiento:</strong> Cajas corrugadas, papel bond, periódicos secos.
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Separación:</strong> Desarmar cajas para dejarlas planas. No mezclar con papel plastificado o engrasado (cajas de pizza con queso).
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Riesgo ambiental:</strong> Su descomposición anaeróbica en botaderos genera gas metano de alto efecto invernadero.
                    </p>
                  </div>

                  {/* Vidrio */}
                  <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">🍾</span>
                      <div>
                        <h3 className="font-bold text-slate-900 text-base">Vidrio</h3>
                        <span className="text-[10px] text-slate-500 uppercase font-semibold">Infinitamente Reciclable</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Reconocimiento:</strong> Botellas de vino, cerveza, refresco y frascos de conservas.
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Separación:</strong> Quitar tapas metálicas o corchos. No mezclar con vidrios planos de ventanas o espejos (tienen otro punto de fusión).
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Riesgo ambiental:</strong> No se degrada biológicamente. En bosques secos como la Chiquitania puede actuar como lupa e iniciar incendios.
                    </p>
                  </div>

                  {/* Metales */}
                  <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">🥫</span>
                      <div>
                        <h3 className="font-bold text-slate-900 text-base">Metales</h3>
                        <span className="text-[10px] text-slate-500 uppercase font-semibold">Aluminio y Hojalata</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Reconocimiento:</strong> Latas de atún, refresco, perfiles de construcción y cables limpios.
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Separación:</strong> Aplastar latas de bebidas. Retirar restos de comida en hojalata para evitar roedores.
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Riesgo ambiental:</strong> Su extracción virgen destruye ecosistemas y contamina aguas de cabecera con relaves mineros.
                    </p>
                  </div>

                  {/* Orgánicos */}
                  <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">🍎</span>
                      <div>
                        <h3 className="font-bold text-slate-900 text-base">Residuos Orgánicos</h3>
                        <span className="text-[10px] text-slate-500 uppercase font-semibold">Compostaje y Humus</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Reconocimiento:</strong> Cáscaras de fruta, verduras, restos de café y podas de jardín.
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Separación:</strong> Separar en compostera casera con capas secas (hojarasca/aserrín). Evitar carnes y heces de mascotas.
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Riesgo ambiental:</strong> Representan más del 55% de la basura urbana en Bolivia. Producen lixiviados venenosos en botaderos.
                    </p>
                  </div>

                  {/* Electrónicos (RAEE) */}
                  <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">💻</span>
                      <div>
                        <h3 className="font-bold text-slate-900 text-base">Electrónicos (RAEE)</h3>
                        <span className="text-[10px] text-slate-500 uppercase font-semibold">Manejo Especial</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Reconocimiento:</strong> Teléfonos, cargadores, tarjetas madres, pilas y baterías de litio.
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Separación:</strong> NUNCA botar al basurero común. Cubrir bornes de baterías con cinta adhesiva para evitar cortocircuitos.
                    </p>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      <strong>Riesgo ambiental:</strong> Una sola pila de botón puede contaminar hasta 600,000 litros de agua dulce.
                    </p>
                  </div>

                </div>

                {/* Plan de Acción: Suelo, Agua, Aire */}
                <div className="bg-eco-950 text-white rounded-3xl p-6 sm:p-10 space-y-6">
                  <h2 className="text-2xl font-bold text-eco-300">Acciones cotidianas para frenar la contaminación en Bolivia</h2>
                  
                  <div className="grid md:grid-cols-3 gap-6 text-xs text-slate-300 leading-relaxed">
                    <div className="space-y-2 border-l-2 border-eco-500 pl-4">
                      <h4 className="text-white font-bold text-sm">Protección del Suelo</h4>
                      <p>• Jamás deseches aceite de cocina usado en la tierra ni por el desagüe (1 litro de aceite contamina 1,000 litros de agua).</p>
                      <p>• Prefiere abonos orgánicos a fertilizantes químicos que salinizan los suelos del altiplano y valles.</p>
                    </div>

                    <div className="space-y-2 border-l-2 border-blue-400 pl-4">
                      <h4 className="text-white font-bold text-sm">Cuidado del Agua</h4>
                      <p>• Participa en limpiezas comunitarias de cuencas y no tires bolsas plásticas en torrenteras antes de la época de lluvias.</p>
                      <p>• Apoya a los recicladores de base: ellos retiran de circulación plásticos antes de que lleguen a los lagos Titicaca o Poopó.</p>
                    </div>

                    <div className="space-y-2 border-l-2 border-amber-400 pl-4">
                      <h4 className="text-white font-bold text-sm">Defensa del Aire</h4>
                      <p>• Di no al "chaqueo" o quema de basura doméstica y llantas en San Juan o fiestas patronales.</p>
                      <p>• Promueve la movilidad compartida o bicicleta en nuestras ciudades congestionadas.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL CONFIGURACIÓN GEMINI API */}
          {apiKeyModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-900 text-base flex items-center gap-2">
                    <span>⚙️</span> Configuración de IA Gemini
                  </h3>
                  <button onClick={() => setApiKeyModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
                </div>

                <p className="text-xs text-slate-600 leading-relaxed">
                  EcoCircular funciona de manera predeterminada en <strong>Modo Demostración</strong> para presentaciones académicas sin requerir credenciales externas.
                </p>

                <div className="space-y-3 text-xs">
                  <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                    <span className="font-semibold text-slate-700">Forzar Modo Demostrativo (Offline):</span>
                    <input 
                      type="checkbox" 
                      checked={modoDemoForzado} 
                      onChange={(e) => setModoDemoForzado(e.target.checked)}
                      className="w-4 h-4 text-eco-600 rounded"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 uppercase text-[10px] mb-1">
                      API Key de Google AI Studio (Opcional)
                    </label>
                    <input 
                      type="password" 
                      placeholder="AIzaSy..." 
                      value={apiKey}
                      onChange={(e) => {
                        setApiKey(e.target.value);
                        localStorage.setItem('ecocircular_gemini_key', e.target.value);
                      }}
                      className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-800 text-xs focus:ring-2 focus:ring-eco-500"
                    />
                    <span className="text-[10px] text-slate-400 mt-1 block">
                      Se conserva en el localStorage de este navegador. Para despliegues de producción, se conecta vía endpoint seguro.
                    </span>
                  </div>
                </div>

                <div className="pt-2 flex justify-end gap-2">
                  <button 
                    onClick={() => setApiKeyModal(false)}
                    className="bg-eco-600 hover:bg-eco-700 text-white font-bold text-xs py-2 px-4 rounded-xl"
                  >
                    Guardar y Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-10 border-t border-slate-800 mt-auto">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 grid grid-cols-1 md:grid-cols-4 gap-8">
              <div className="space-y-2 md:col-span-2">
                <div className="flex items-center gap-2 text-white font-bold text-base">
                  <span className="text-eco-400">●</span> EcoCircular Bolivia
                </div>
                <p className="text-slate-400 text-xs max-w-sm leading-relaxed">
                  Prototipo funcional de economía circular y educación ambiental. Desarrollado con tecnología web moderna e Inteligencia Artificial multimodal para mitigar la contaminación urbana.
                </p>
                <p className="text-[10px] text-slate-400">© 2026 EcoCircular — Datos demostrativos para presentación técnica.</p>
              </div>

              <div>
                <h4 className="font-bold text-white text-xs uppercase tracking-wider mb-2">Secciones</h4>
                <ul className="space-y-1.5 text-xs">
                  <li><button onClick={() => setVista('inicio')} className="hover:text-eco-400">Página Principal</button></li>
                  <li><button onClick={() => { detenerCamara(); setVista('escanear'); }} className="hover:text-eco-400">Identificador con Cámara</button></li>
                  <li><button onClick={() => setVista('directorio')} className="hover:text-eco-400">Directorio de Agencias</button></li>
                  <li><button onClick={() => setVista('guia')} className="hover:text-eco-400">Guía de Suelo, Agua y Aire</button></li>
                </ul>
              </div>

              <div>
                <h4 className="font-bold text-white text-xs uppercase tracking-wider mb-2">Valores y Compromiso</h4>
                <p className="text-slate-400 text-xs leading-relaxed">
                  Promovemos la dignificación de los recicladores de base y el cumplimiento de las metas de desarrollo sostenible en comunidades urbanas y rurales.
                </p>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Renderizado en DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
